name: macOS
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localization coverage
        run: python3 SpaceMithra/scripts/check_localization.py
      - name: Isolated core tests
        working-directory: SpaceMithra
        run: SPACEMITHRA_TEST_MODE=1 swift test
      - name: Universal release build
        run: xcodebuild -project SpaceMithra/SpaceMithra.xcodeproj -scheme SpaceMithra -configuration Release -derivedDataPath build ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
